bio: "Hello! 🌼 I am an HCI researcher designing and studying telepresence and XR systems that enable people to collaborate across distance and media. My work explores proxy-mediated collaboration, investigating how embodied representations such as robots and avatars become entities people can meaningfully collaborate with across space and time."
